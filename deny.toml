# License gate for the default build (#25). `cargo deny check licenses`
# refuses any crate whose license expression is not satisfied by this list,
# so GPL, LGPL, AGPL and proprietary or unlicensed crates fail. Dual-licensed
# crates pass through their permissive option. MPL-2.0 is file-level
# copyleft that does not reach linking code; it is allowed.
[graph]
all-features = false

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Optional-feature crates use some allowances the default graph does not.
unused-allowed-license = "allow"
