[package]
name = "hashi"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Connector engine: industrial protocols and change data capture with one checkpointed contract."
publish = false

[dependencies]
async-opcua = { version = "0.19.0", features = ["client"], optional = true }
parquet = { version = "60.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false, features = ["serde"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "time"], optional = true }
url = { version = "2.5.8", optional = true }

[features]
opcua = ["dep:async-opcua", "dep:tokio", "dep:url"]
opcua-simulator = ["opcua", "async-opcua/server", "tokio/net", "tokio/macros"]
