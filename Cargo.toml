[package]
name = "hashi"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Connector engine: industrial protocols and change data capture with one checkpointed contract."
publish = false

[dependencies]
async-trait = { version = "0.1.89", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"], optional = true }
mysql_common = { version = "0.37.1", default-features = false, features = ["binlog"], optional = true }
futures-util = { version = "0.3.34", optional = true }
async-opcua = { version = "0.19.0", features = ["client"], optional = true }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"], optional = true }
parquet = { version = "60.0.0", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
serialport = { version = "4.10.1", default-features = false, optional = true }
toml = { version = "0.9.12", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.54.0", default-features = false, features = ["rt-multi-thread", "time"], optional = true }
url = { version = "2.5.8", optional = true }

[features]
default = ["parquet", "modbus"]
parquet = ["dep:parquet"]
modbus = ["dep:serialport"]
mysql = ["dep:chrono", "dep:mysql_async", "dep:mysql_common", "dep:futures-util", "dep:tokio"]
mqtt = ["dep:prost", "dep:rumqttc", "dep:rustls", "dep:tokio"]
opcua = ["dep:async-opcua", "dep:tokio", "dep:url"]
opcua-simulator = ["dep:async-trait", "opcua", "async-opcua/server", "tokio/net", "tokio/macros"]

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false

# rumqttc 0.25.1, the latest release, pins rustls-webpki 0.102, which has no
# fix for RUSTSEC-2026-0382. This fork commit is the 0.25.1 release plus only
# the bump to rustls-webpki 0.103.16. Remove this patch once a rumqttc release
# ships on rustls-webpki 0.103.16 or later (#62).
[patch.crates-io]
rumqttc = { git = "https://github.com/Sannrox/rumqtt", rev = "5606f188d502117696f834f472970508e0988d1d" }
